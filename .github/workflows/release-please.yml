on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      mangal_version:
        description: "mangal release tag (e.g., 'v4.0.6-3'). Defaults to the latest release"
        required: false
  repository_dispatch:
    types: [mangal-release]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

name: release-please
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - uses: pnpm/action-setup@v4.0.0
        name: Install pnpm
        id: pnpm-install
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v2

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Resolve mangal version
        id: mangal
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISPATCH_VERSION: ${{ github.event.client_payload.mangal_version || inputs.mangal_version }}
        run: |
          VERSION="${DISPATCH_VERSION:-$(gh release view --repo ${{ github.repository_owner }}/mangal --json tagName -q .tagName)}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=mangal-${{ steps.mangal.outputs.version }}

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: MANGAL_VERSION=${{ steps.mangal.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Send GitHub webhook
        env:
          WEBHOOK_SERVER: ${{ secrets.WEBHOOK_SERVER }}
          WEBHOOK_SERVER_SECRET: ${{ secrets.WEBHOOK_SERVER_SECRET }}
          EVENT: push
          PAYLOAD_FILE: payload.json
        run: |
          echo "{\"repository\": {\"name\": \"${GITHUB_REPOSITORY##*/}\"}}" > "$PAYLOAD_FILE"
          SIG="sha256=$(openssl dgst -sha256 -hmac "$WEBHOOK_SERVER_SECRET" "$PAYLOAD_FILE" | sed 's/^.* //')"
          DELIVERY_ID=$(uuidgen)
          curl -fsS -X POST "$WEBHOOK_SERVER" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -H "X-GitHub-Event: $EVENT" \
            -H "X-GitHub-Delivery: $DELIVERY_ID" \
            --data-binary "@$PAYLOAD_FILE"
